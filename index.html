<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viajes | Asistente Personal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-app: #F3F4F6;
            --surface: #FFFFFF;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border-color: #E5E7EB;
            --accent-primary: #3B82F6;
            --danger: #EF4444;
            
            /* Colores Premium para Tareas */
            --ok-bg: #D1FAE5;
            --ok-text: #065F46;
            --parcial-bg: #FEF3C7;
            --parcial-text: #92400E;
            --btn-idle-bg: #F3F4F6;
            --btn-idle-text: #9CA3AF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-app); color: var(--text-primary); padding-bottom: 100px; -webkit-font-smoothing: antialiased; }

        header {
            background-color: var(--surface);
            padding: 24px 20px 16px;
            position: sticky; top: 0; z-index: 10;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }
        h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.025em; }
        .subtitle { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

        .container { padding: 24px 16px; max-width: 800px; margin: 0 auto; }
        
        .tab-content { display: none; animation: fadeIn 0.2s ease-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .category-group { margin-bottom: 32px; }
        .category-title { 
            font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); 
            text-transform: uppercase; letter-spacing: 0.05em; 
            margin-bottom: 12px; margin-left: 4px;
        }
        
        .list-card { 
            background: var(--surface); 
            border-radius: 16px; 
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            overflow: hidden; 
        }

        .item-row { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-color); transition: background 0.2s; }
        .item-row:last-child { border-bottom: none; }
        .item-left { display: flex; align-items: center; gap: 16px; flex-grow: 1; cursor: pointer; }
        
        .circle-check { 
            width: 24px; height: 24px; border-radius: 50%; 
            border: 2px solid #D1D5DB; display: flex; align-items: center; justify-content: center; 
            transition: all 0.2s ease; flex-shrink: 0;
        }
        .circle-check .material-icons-outlined { font-size: 16px; color: transparent; font-weight: 600; }
        
        .item-row.checked .circle-check { background: var(--accent-primary); border-color: var(--accent-primary); }
        .item-row.checked .circle-check .material-icons-outlined { color: white; }
        
        .item-text { font-size: 0.95rem; font-weight: 500; color: var(--text-primary); transition: color 0.2s; }
        .item-row.checked .item-text { color: var(--text-secondary); text-decoration: line-through; }

        /* Estilos Premium para Tareas */
        .task-row { flex-wrap: wrap; gap: 12px; }
        .task-priority { 
            font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); 
            background: var(--bg-app); padding: 4px 8px; border-radius: 6px; min-width: 28px; text-align: center;
        }
        .task-text { flex-grow: 1; font-size: 0.95rem; font-weight: 500; min-width: 140px; }
        
        .task-row.status-ok { background-color: rgba(209, 250, 229, 0.3); }
        .task-row.status-ok .task-text { color: var(--ok-text); text-decoration: line-through; }
        
        .task-row.status-parcial { background-color: rgba(254, 243, 199, 0.3); }
        .task-row.status-parcial .task-text { color: var(--parcial-text); }
        
        .task-controls { display: flex; gap: 8px; margin-left: auto; align-items: center; }
        .check-btn { 
            padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 0.75rem; 
            cursor: pointer; border: none; transition: all 0.2s ease;
            background: var(--btn-idle-bg); color: var(--btn-idle-text);
        }
        
        .task-row.status-ok .check-btn.ok-btn { background: var(--ok-bg); color: var(--ok-text); }
        .task-row.status-parcial .check-btn.parcial-btn { background: var(--parcial-bg); color: var(--parcial-text); }

        .actions { display: flex; gap: 4px; opacity: 0.6; transition: opacity 0.2s; }
        .item-row:hover .actions { opacity: 1; }
        .btn-icon { 
            background: transparent; border: none; padding: 8px; border-radius: 8px; 
            color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; transition: 0.2s;
        }
        .btn-icon:hover { background: var(--bg-app); color: var(--text-primary); }
        .btn-icon.delete:hover { background: #FEE2E2; color: var(--danger); }
        .btn-icon .material-icons-outlined { font-size: 20px; }

        .add-row { 
            display: flex; align-items: center; gap: 12px; padding: 16px; 
            cursor: pointer; color: var(--accent-primary); font-weight: 500; font-size: 0.95rem; 
            transition: background 0.2s;
        }
        .add-row:hover { background: #EFF6FF; }
        .add-row .material-icons-outlined { font-size: 22px; }

        .btn-reset-all { 
            display: block; width: 100%; text-align: center; padding: 16px; margin: 32px 0; 
            background: transparent; border: 1px solid var(--border-color); border-radius: 12px; 
            color: var(--danger); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-reset-all:hover { background: #FEE2E2; border-color: #FCA5A5; }

        /* Navegación Inferior */
        .tab-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color); 
            display: flex; justify-content: space-around; padding: 12px 0 24px 0; z-index: 20; 
        }
        .tab-item { 
            display: flex; flex-direction: column; align-items: center; gap: 4px; 
            background: none; border: none; color: var(--text-secondary); cursor: pointer; flex: 1; transition: color 0.2s;
        }
        .tab-item.active { color: var(--accent-primary); }
        .tab-item .material-icons-outlined { font-size: 24px; }
        .tab-item span { font-size: 0.7rem; font-weight: 600; }

        /* Modales */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17, 24, 39, 0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 50; }
        .overlay.active { display: flex; }
        .modal { background: var(--surface); width: 90%; max-width: 360px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); overflow: hidden; transform: scale(0.95); transition: transform 0.2s; }
        .overlay.active .modal { transform: scale(1); }
        .modal-content { padding: 24px; text-align: center; }
        .modal-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; color: var(--text-primary); }
        .modal-input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-app); font-size: 0.95rem; font-weight: 500; outline: none; margin-bottom: 12px; transition: border-color 0.2s; }
        .modal-input:focus { border-color: var(--accent-primary); background: var(--surface); }
        .modal-actions { display: flex; border-top: 1px solid var(--border-color); }
        .modal-actions button { flex: 1; padding: 16px; background: none; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .modal-actions button:hover { background: var(--bg-app); }
        .modal-actions button:first-child { border-right: 1px solid var(--border-color); color: var(--text-secondary); }
        .modal-actions button:last-child { color: var(--accent-primary); }
        .modal-actions button.btn-danger { color: var(--danger); }
    </style>
</head>
<body>

    <header>
        <h1>Viajes JCP ↔ PB</h1>
        <div class="subtitle">iAGENTES.TECH</div>
    </header>

    <div class="container">
        <div id="tab-tareas" class="tab-content active">
            <div class="category-group">
                <div class="category-title">Pendientes por Prioridad</div>
                <div class="list-card" id="tareas-container"></div>
            </div>
            <button class="btn-reset-all" onclick="resetTareas()">Reiniciar Estados de Tareas</button>
        </div>

        <div id="tab-equipaje" class="tab-content"><div id="equipaje-container"></div><button class="btn-reset-all" onclick="resetTab('equipaje')">Desmarcar Equipaje</button></div>
        <div id="tab-casas" class="tab-content"><div id="casas-container"></div><button class="btn-reset-all" onclick="resetTab('casas')">Desmarcar Casas</button></div>
        <div id="tab-ranger" class="tab-content"><div id="ranger-container"></div><button class="btn-reset-all" onclick="resetTab('ranger')">Desmarcar Ranger</button></div>
    </div>

    <nav class="tab-bar">
        <button class="tab-item active" onclick="switchTab('tab-tareas', this)"><span class="material-icons-outlined">format_list_bulleted</span><span>Tareas</span></button>
        <button class="tab-item" onclick="switchTab('tab-equipaje', this)"><span class="material-icons-outlined">backpack</span><span>Equipaje</span></button>
        <button class="tab-item" onclick="switchTab('tab-casas', this)"><span class="material-icons-outlined">home</span><span>Casas</span></button>
        <button class="tab-item" onclick="switchTab('tab-ranger', this)"><span class="material-icons-outlined">directions_car</span><span>Ranger</span></button>
    </nav>

    <div class="overlay" id="action-modal">
        <div class="modal">
            <div class="modal-content">
                <div class="modal-title" id="modal-title">Acción</div>
                <input type="number" id="modal-priority" class="modal-input" placeholder="Nº de Prioridad (Ej: 1, 2)" style="display: none;">
                <input type="text" id="modal-input" class="modal-input" placeholder="Nombre del ítem">
            </div>
            <div class="modal-actions"><button onclick="closeModal('action-modal')">Cancelar</button><button id="modal-confirm">Guardar</button></div>
        </div>
    </div>

    <div class="overlay" id="delete-modal">
        <div class="modal">
            <div class="modal-content"><div class="modal-title">¿Eliminar ítem?</div><div style="font-size: 0.9rem; color: var(--text-secondary);">Esta acción no se puede deshacer.</div></div>
            <div class="modal-actions"><button onclick="closeModal('delete-modal')">Cancelar</button><button class="btn-danger" id="delete-confirm">Eliminar</button></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://zsykcyqlcrodcxonsztf.supabase.co';
        const supabaseKey = 'sb_secret_v8VSVeLomwjs9hZyYvTpaA_G9JwlBS4';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const defaultData = {
            tareas: [
                { priority: 1, text: "Armar bolsos", status: "pending" },
                { priority: 2, text: "Revisar fluidos Ranger", status: "parcial" },
                { priority: 3, text: "Cargar combustible", status: "ok" }
            ],
            equipaje: [
                { cat: "Documentación y Finanzas", items: [{text: "Billetera", checked: false}, {text: "Dinero", checked: false}, {text: "DNI", checked: false}, {text: "Documentación del auto", checked: false}, {text: "Tarjetas y cuentas a pagar", checked: false}] },
                { cat: "Tecnología", items: [{text: "Celular", checked: false}, {text: "Cargador del celular", checked: false}, {text: "Auriculares", checked: false}, {text: "Tablet", checked: false}, {text: "Cargador de la Tablet", checked: false}, {text: "Notebook (Compu)", checked: false}, {text: "Cargador de la Notebook", checked: false}] },
                { cat: "Vehículo y Herramientas", items: [{text: "Gasoil", checked: false}, {text: "Cargador batería", checked: false}, {text: "Inflador neumáticos", checked: false}, {text: "Linterna", checked: false}, {text: "Máquina de fumigar", checked: false}, {text: "Garrafa", checked: false}, {text: "Pala de punta", checked: false}, {text: "Escoba plástica", checked: false}] },
                { cat: "Indumentaria y Calzado", items: [{text: "Remeras x 4", checked: false}, {text: "Calzoncillos x 3", checked: false}, {text: "Medias x 3", checked: false}, {text: "Shorts x 3", checked: false}, {text: "Bermudas x 2", checked: false}, {text: "Jeans x 2", checked: false}, {text: "Pantalón largo de gimnasia", checked: false}, {text: "Buzo", checked: false}, {text: "Camperas x 2", checked: false}, {text: "Zapatillas x 2", checked: false}, {text: "Ojotas", checked: false}, {text: "Botas", checked: false}, {text: "Sombrero", checked: false}, {text: "Gorra", checked: false}, {text: "Paraguas", checked: false}, {text: "Anteojos x 2", checked: false}, {text: "Mochila para ropa", checked: false}] },
                { cat: "Higiene y Cuidado Personal", items: [{text: "Toallón", checked: false}, {text: "Toalla", checked: false}, {text: "Jabón", checked: false}, {text: "Shampoo", checked: false}, {text: "Crema", checked: false}, {text: "Desodorante", checked: false}, {text: "Cepillo de dientes", checked: false}, {text: "Dentífrico", checked: false}, {text: "Peine", checked: false}, {text: "Pañuelos descartables x 3", checked: false}] },
                { cat: "Salud y Entrenamiento", items: [{text: "Tensiómetro", checked: false}, {text: "Flogocox 120 mg", checked: false}, {text: "Manta térmica caliente cintura", checked: false}, {text: "Manga para congelar cintura", checked: false}, {text: "Masajeador", checked: false}, {text: "Electroestimulador", checked: false}, {text: "Banda de gimnasia", checked: false}, {text: "Guantes de gimnasia", checked: false}, {text: "Bolso Tenis / Padel", checked: false}] },
                { cat: "Comida, Mate y Vajilla", items: [{text: "Mate", checked: false}, {text: "Bombilla", checked: false}, {text: "Yerba", checked: false}, {text: "Azúcar", checked: false}, {text: "Agua caliente", checked: false}, {text: "Agua mineral", checked: false}, {text: "Galletitas", checked: false}, {text: "Conservadora", checked: false}, {text: "Caja para asado", checked: false}, {text: "Mochila con vajilla", checked: false}, {text: "Plato", checked: false}, {text: "Cuchillos x 2", checked: false}, {text: "Tenedor", checked: false}, {text: "Cuchara", checked: false}, {text: "Vaso", checked: false}, {text: "Servilleta", checked: false}, {text: "Repasador", checked: false}, {text: "Sal", checked: false}, {text: "Encendedor", checked: false}] },
                { cat: "Varios", items: [{text: "Sábanas", checked: false}, {text: "Frazada", checked: false}, {text: "Anotador y lapiceras", checked: false}] }
            ],
            casas: [
                { cat: "José C. Paz (Salida)", items: [{text: "Cerrar llave de gas", checked: false}, {text: "Desenchufar electrodomésticos grandes", checked: false}, {text: "Activar alarma / cámaras", checked: false}] },
                { cat: "Pueblo Belgrano (Salida)", items: [{text: "Vaciar y apagar heladera", checked: false}, {text: "Cerrar paso de agua y purgar", checked: false}, {text: "Asegurar postigos y ventanas", checked: false}] }
            ],
            ranger: [
                { cat: "Revisión Técnica", items: [{text: "Presión de neumáticos y auxilio", checked: false}, {text: "Nivel de aceite y líquido refrigerante", checked: false}, {text: "Líquido limpiaparabrisas", checked: false}, {text: "Verificar luces (posición, baja, alta, giro, freno)", checked: false}] }
            ]
        };

        let appData = defaultData;
        
        async function initApp() {
            const { data, error } = await supabaseClient.from('app_viajes').select('datos').eq('id', 'estado_v2').single();
            if (data && data.datos && Object.keys(data.datos).length > 0) {
                appData = data.datos;
                if(!appData.tareas) appData.tareas = defaultData.tareas;
            } else { 
                appData = defaultData;
                saveData(); 
            }
            renderAll();
        }

        async function saveData() { await supabaseClient.from('app_viajes').upsert({ id: 'estado_v2', datos: appData }); }

        supabaseClient.channel('schema-db-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'app_viajes' }, (payload) => {
            if(payload.new && payload.new.datos) { appData = payload.new.datos; renderAll(); }
        }).subscribe();

        function renderAll() {
            renderTareas(); renderCategory('equipaje'); renderCategory('casas'); renderCategory('ranger');
        }

        function renderTareas() {
            const container = document.getElementById('tareas-container');
            if(!container) return;
            appData.tareas.sort((a, b) => a.priority - b.priority);

            let html = "";
            appData.tareas.forEach((tarea, iIndex) => {
                let rowClass = tarea.status === 'ok' ? 'status-ok' : (tarea.status === 'parcial' ? 'status-parcial' : '');
                html += `
                    <div class="item-row task-row ${rowClass}">
                        <div class="task-priority">${tarea.priority}</div>
                        <div class="task-text">${tarea.text}</div>
                        <div class="task-controls">
                            <button class="check-btn ok-btn" onclick="toggleTask('${iIndex}', 'ok')">OK</button>
                            <button class="check-btn parcial-btn" onclick="toggleTask('${iIndex}', 'parcial')">PARCIAL</button>
                        </div>
                        <div class="actions">
                            <button class="btn-icon" onclick="openTaskEditModal(${iIndex}, ${tarea.priority}, '${tarea.text.replace(/'/g, "\\'")}')"><span class="material-icons-outlined">edit</span></button>
                            <button class="btn-icon delete" onclick="openTaskDeleteModal(${iIndex})"><span class="material-icons-outlined">delete</span></button>
                        </div>
                    </div>
                `;
            });
            html += `<div class="add-row" onclick="openTaskAddModal()"><span class="material-icons-outlined">add_circle_outline</span><span>Añadir nueva tarea</span></div>`;
            container.innerHTML = html;
        }

        window.toggleTask = function(index, status) {
            let current = appData.tareas[index].status;
            appData.tareas[index].status = (current === status) ? 'pending' : status;
            saveData(); renderAll();
        }

        window.resetTareas = function() {
            if(confirm("¿Restaurar estado de todas las tareas a Pendiente?")) {
                appData.tareas.forEach(t => t.status = 'pending');
                saveData(); renderAll();
            }
        }

        window.renderCategory = function(sectionId) {
            const container = document.getElementById(`${sectionId}-container`);
            if(!container || !appData[sectionId]) return;
            let html = "";
            appData[sectionId].forEach((group, gIndex) => {
                html += `<div class="category-group"><div class="category-title">${group.cat}</div><div class="list-card">`;
                group.items.forEach((item, iIndex) => {
                    const isChecked = item.checked ? 'checked' : '';
                    html += `
                        <div class="item-row ${isChecked}">
                            <div class="item-left" onclick="toggleItem('${sectionId}', ${gIndex}, ${iIndex})">
                                <div class="circle-check"><span class="material-icons-outlined">check</span></div>
                                <span class="item-text">${item.text}</span>
                            </div>
                            <div class="actions">
                                <button class="btn-icon" onclick="openEditModal('${sectionId}', ${gIndex}, ${iIndex}, '${item.text.replace(/'/g, "\\'")}')"><span class="material-icons-outlined">edit</span></button>
                                <button class="btn-icon delete" onclick="openDeleteModal('${sectionId}', ${gIndex}, ${iIndex})"><span class="material-icons-outlined">delete</span></button>
                            </div>
                        </div>
                    `;
                });
                html += `<div class="add-row" onclick="openAddModal('${sectionId}', ${gIndex}, '${group.cat}')"><span class="material-icons-outlined">add_circle_outline</span><span>Añadir ítem</span></div></div></div>`;
            });
            container.innerHTML = html;
        }

        window.toggleItem = function(sectionId, gIndex, iIndex) {
            appData[sectionId][gIndex].items[iIndex].checked = !appData[sectionId][gIndex].items[iIndex].checked;
            saveData(); renderAll();
        }

        window.resetTab = function(section) {
            if(confirm("¿Querés desmarcar todos los casilleros de esta sección?")) {
                appData[section].forEach(group => group.items.forEach(item => item.checked = false));
                saveData(); renderAll();
            }
        }

        const actionModal = document.getElementById('action-modal');
        const modalInput = document.getElementById('modal-input');
        const modalPriority = document.getElementById('modal-priority');
        const modalConfirm = document.getElementById('modal-confirm');
        const deleteModal = document.getElementById('delete-modal');

        window.closeModal = (id) => { document.getElementById(id).classList.remove('active'); }

        window.openTaskAddModal = function() {
            document.getElementById('modal-title').innerText = `Nueva Tarea`;
            modalInput.value = ''; modalPriority.value = '';
            modalPriority.style.display = 'block';
            actionModal.classList.add('active');
            setTimeout(() => modalPriority.focus(), 100);
            
            modalConfirm.onclick = function() {
                if(modalInput.value.trim() !== '' && modalPriority.value !== '') {
                    appData.tareas.push({ priority: parseInt(modalPriority.value), text: modalInput.value.trim(), status: 'pending' });
                    saveData(); renderAll(); closeModal('action-modal');
                }
            };
        }

        window.openTaskEditModal = function(iIndex, currentPriority, currentText) {
            document.getElementById('modal-title').innerText = `Editar Tarea`;
            modalInput.value = currentText; modalPriority.value = currentPriority;
            modalPriority.style.display = 'block';
            actionModal.classList.add('active');
            
            modalConfirm.onclick = function() {
                if(modalInput.value.trim() !== '' && modalPriority.value !== '') {
                    appData.tareas[iIndex].priority = parseInt(modalPriority.value);
                    appData.tareas[iIndex].text = modalInput.value.trim();
                    saveData(); renderAll(); closeModal('action-modal');
                }
            };
        }

        window.openTaskDeleteModal = function(iIndex) {
            deleteModal.classList.add('active');
            document.getElementById('delete-confirm').onclick = function() {
                appData.tareas.splice(iIndex, 1);
                saveData(); renderAll(); closeModal('delete-modal');
            };
        }

        window.openAddModal = function(sectionId, gIndex, catName) {
            document.getElementById('modal-title').innerText = `Añadir a ${catName}`;
            modalInput.value = ''; modalPriority.style.display = 'none';
            actionModal.classList.add('active');
            setTimeout(() => modalInput.focus(), 100);
            
            modalConfirm.onclick = function() {
                if(modalInput.value.trim() !== '') {
                    appData[sectionId][gIndex].items.push({ text: modalInput.value.trim(), checked: false });
                    saveData(); renderAll(); closeModal('action-modal');
                }
            };
        }

        window.openEditModal = function(sectionId, gIndex, iIndex, currentText) {
            document.getElementById('modal-title').innerText = 'Editar Ítem';
            modalInput.value = currentText; modalPriority.style.display = 'none';
            actionModal.classList.add('active');
            setTimeout(() => modalInput.focus(), 100);
            
            modalConfirm.onclick = function() {
                if(modalInput.value.trim() !== '') {
                    appData[sectionId][gIndex].items[iIndex].text = modalInput.value.trim();
                    saveData(); renderAll(); closeModal('action-modal');
                }
            };
        }

        window.openDeleteModal = function(sectionId, gIndex, iIndex) {
            deleteModal.classList.add('active');
            document.getElementById('delete-confirm').onclick = function() {
                appData[sectionId][gIndex].items.splice(iIndex, 1);
                saveData(); renderAll(); closeModal('delete-modal');
            };
        }

        window.switchTab = function(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        initApp();
    </script>
</body>
</html>
